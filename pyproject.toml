[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "house-chime"
version = "0.2.2"
description = "Home Assistant custom integration for household audio announcements."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pyyaml>=6.0.2",
  "voluptuous>=0.15.2",
]

[tool.setuptools]
py-modules = []
