title: House Chime
views:
  - title: Announcements
    path: house-chime
    icon: mdi:speaker-message
    cards:
      - type: markdown
        title: House Chime
        content: |
          Use this page to check readiness, run silent dry runs, and manually test announcements.

          Configuration belongs in Devices & Services, not on this operator dashboard.

      - type: entities
        title: Operator Status
        entities:
          - entity: binary_sensor.house_chime_integration_ready
            name: Ready
          - entity: sensor.house_chime_active_household_context
            name: Active household context
          - entity: binary_sensor.house_chime_quiet_mode_active
            name: Quiet mode active
          - entity: sensor.house_chime_selected_target_zones
            name: Announcement speakers
          - entity: sensor.house_chime_last_played_event
            name: Last announcement

      - type: grid
        title: Dry Run
        columns: 3
        square: false
        cards:
          - type: button
            name: Dry Run Approach
            icon: mdi:file-search
            tap_action:
              action: call-service
              service: house_chime.resolve
              data:
                event_id: front_door_approach
          - type: button
            name: Dry Run Package
            icon: mdi:file-search
            tap_action:
              action: call-service
              service: house_chime.resolve
              data:
                event_id: front_door_package
          - type: button
            name: Dry Run Doorbell
            icon: mdi:file-search
            tap_action:
              action: call-service
              service: house_chime.resolve
              data:
                event_id: front_door_doorbell

      - type: grid
        title: Audible Tests
        columns: 3
        square: false
        cards:
          - type: button
            name: Play Approach
            icon: mdi:door-open
            tap_action:
              action: call-service
              service: house_chime.play
              data:
                event_id: front_door_approach
          - type: button
            name: Play Package
            icon: mdi:package-variant
            tap_action:
              action: call-service
              service: house_chime.play
              data:
                event_id: front_door_package
          - type: button
            name: Play Doorbell
            icon: mdi:doorbell-video
            tap_action:
              action: call-service
              service: house_chime.play
              data:
                event_id: front_door_doorbell

      - type: entities
        title: Diagnostics
        entities:
          - entity: binary_sensor.house_chime_last_resolution_valid
            name: Last dry run valid
          - entity: sensor.house_chime_last_resolved_event
            name: Last dry run
          - entity: sensor.house_chime_last_media_path
            name: Last media
          - entity: sensor.house_chime_last_failure_reason
            name: Last failure
