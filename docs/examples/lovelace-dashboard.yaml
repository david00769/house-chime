title: House Chime
views:
  - title: Announcements
    path: house-chime
    icon: mdi:speaker-message
    cards:
      - type: markdown
        title: House Chime
        content: |
          Use this page to check readiness, confirm the current announcement level, run silent dry runs, and deliberately test announcements.

          Household playback controls are exposed as one House Chime switch per configured Home Assistant person. Add those generated switches from the House Chime device page; this generic example deliberately contains no household entity IDs.

      - type: entities
        title: Operator Status
        entities:
          - entity: binary_sensor.house_chime_integration_ready
            name: Ready
          - entity: sensor.house_chime_active_household_context
            name: Chosen listener
          - entity: sensor.house_chime_people_home
            name: People home
          - entity: sensor.house_chime_enabled_listeners_home
            name: Enabled listeners home
          - entity: sensor.house_chime_muted_listeners_home
            name: Muted listeners home
          - entity: sensor.house_chime_last_suppression_reason
            name: Last intentional suppression
          - entity: binary_sensor.house_chime_quiet_mode_active
            name: Quiet mode active
          - entity: sensor.house_chime_daytime_announcement_volume
            name: Daytime volume
          - entity: sensor.house_chime_last_effective_announcement_volume
            name: Last effective volume
          - entity: sensor.house_chime_selected_target_zones
            name: Announcement speakers
          - entity: sensor.house_chime_last_played_event
            name: Last announcement

      - type: grid
        title: Dry Run
        columns: 3
        square: false
        cards:
          - type: button
            name: Dry Run Approach
            icon: mdi:file-search
            tap_action:
              action: call-service
              service: house_chime.resolve
              data:
                event_id: front_door_approach
          - type: button
            name: Dry Run Package
            icon: mdi:file-search
            tap_action:
              action: call-service
              service: house_chime.resolve
              data:
                event_id: front_door_package
          - type: button
            name: Dry Run Doorbell
            icon: mdi:file-search
            tap_action:
              action: call-service
              service: house_chime.resolve
              data:
                event_id: front_door_doorbell

      - type: grid
        title: Audible Tests
        columns: 3
        square: false
        cards:
          - type: button
            name: Play Approach
            icon: mdi:door-open
            tap_action:
              action: call-service
              service: house_chime.play
              data:
                event_id: front_door_approach
                skip_duplicate_suppression: true
          - type: button
            name: Play Package
            icon: mdi:package-variant
            tap_action:
              action: call-service
              service: house_chime.play
              data:
                event_id: front_door_package
                skip_duplicate_suppression: true
          - type: button
            name: Play Doorbell
            icon: mdi:doorbell-video
            tap_action:
              action: call-service
              service: house_chime.play
              data:
                event_id: front_door_doorbell
                skip_duplicate_suppression: true

      - type: entities
        title: Diagnostics
        entities:
          - entity: binary_sensor.house_chime_last_resolution_valid
            name: Last dry run valid
          - entity: sensor.house_chime_last_resolved_event
            name: Last dry run
          - entity: sensor.house_chime_last_media_path
            name: Last media
          - entity: sensor.house_chime_last_failure_reason
            name: Last failure
