name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v8

      - name: Install package
        run: uv sync --extra dev

      - name: Validate static files
        run: |
          uv run python -m json.tool hacs.json >/dev/null
          uv run python -m json.tool custom_components/house_chime/manifest.json >/dev/null
          uv run python -m json.tool custom_components/house_chime/translations/en.json >/dev/null
          uv run python - <<'PY'
          import pathlib
          import yaml

          for path in pathlib.Path(".").glob("**/*.yaml"):
              with path.open() as handle:
                  yaml.safe_load(handle)
          PY

      - name: Validate HACS structure
        run: uv run python scripts/check_hacs_structure.py

      - name: Compile integration
        run: uv run python -m compileall custom_components/house_chime tests scripts/check_hacs_structure.py

      - name: Run tests
        run: |
          uv run pytest tests
          uv run python -m unittest discover -s tests
