ready: {}

event_enabled:
  fields:
    event_id:
      required: true
      selector:
        select:
          options:
            - label: Approach
              value: front_door_approach
            - label: Package
              value: front_door_package
            - label: Doorbell
              value: front_door_doorbell

event_can_resolve:
  fields:
    event_id:
      required: true
      selector:
        select:
          options:
            - label: Approach
              value: front_door_approach
            - label: Package
              value: front_door_package
            - label: Doorbell
              value: front_door_doorbell

quiet_mode:
  fields:
    state:
      required: true
      selector:
        select:
          options:
            - active
            - inactive
