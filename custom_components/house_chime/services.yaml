discover:
  name: Discover entities
  description: Discover candidate people, device trackers, and media players from Home Assistant state.

resolve:
  name: Resolve announcement
  description: Resolve an event into media, voice, target zones, volume, quiet rules, and diagnostics without playing it.
  fields:
    event_id:
      name: Event
      description: Announcement event to resolve.
      required: true
      selector:
        select:
          options:
            - label: Approach
              value: front_door_approach
            - label: Package
              value: front_door_package
            - label: Doorbell
              value: front_door_doorbell
    skip_duplicate_suppression:
      name: Skip duplicate suppression
      description: Ignore the event duplicate window for an operator dry run.
      required: false
      default: false
      selector:
        boolean:

play:
  name: Play announcement
  description: Resolve and play an announcement through Music Assistant/Juke.
  fields:
    event_id:
      name: Event
      description: Announcement event to play.
      required: true
      selector:
        select:
          options:
            - label: Approach
              value: front_door_approach
            - label: Package
              value: front_door_package
            - label: Doorbell
              value: front_door_doorbell
    skip_duplicate_suppression:
      name: Skip duplicate suppression
      description: Ignore the event duplicate window for a deliberate manual play test. Leave off for source automations.
      required: false
      default: false
      selector:
        boolean:
