discover:
  name: Discover entities
  description: Discover candidate people, device trackers, and media players from Home Assistant state.

resolve:
  name: Resolve announcement
  description: Resolve an event into media, voice, target zones, volume, quiet rules, and diagnostics without playing it.
  fields:
    event_id:
      name: Event
      description: Announcement event to resolve.
      required: true
      selector:
        select:
          options:
            - label: Approach
              value: front_door_approach
            - label: Package
              value: front_door_package
            - label: Doorbell
              value: front_door_doorbell
    skip_duplicate_suppression:
      name: Skip duplicate suppression
      description: Ignore the event duplicate window for an operator dry run.
      required: false
      default: false
      selector:
        boolean:

ingest_event:
  name: Receive source event
  description: >
    Policy-aware entry point for Package and Doorbell source automations.
    Automatic Approach announcements are direct-sensor-only so House Chime can
    verify continuous person presence; use the configured person-presence binary
    sensor rather than this service for Approach.
  fields:
    event_id:
      name: Event
      description: Announcement event received from a source automation.
      required: true
      selector:
        select:
          options:
            - label: Package
              value: front_door_package
            - label: Doorbell
              value: front_door_doorbell
    skip_duplicate_suppression:
      name: Skip duplicate suppression
      description: Leave off for normal source automations.
      required: false
      default: false
      selector:
        boolean:

play:
  name: Play now
  description: >
    Immediately resolve and play an announcement through Music Assistant/Juke.
    This operator-only bypass is for a deliberate manual test, never an
    automation route. Source automations may use Receive source event only for
    Package and Doorbell.
  fields:
    event_id:
      name: Event
      description: Announcement event to play immediately.
      required: true
      selector:
        select:
          options:
            - label: Approach
              value: front_door_approach
            - label: Package
              value: front_door_package
            - label: Doorbell
              value: front_door_doorbell
    skip_duplicate_suppression:
      name: Skip duplicate suppression
      description: Ignore the event duplicate window for a deliberate operator manual play test.
      required: false
      default: false
      selector:
        boolean:

set_speakers:
  name: Set announcement speakers
  description: Replace the saved announcement speakers with currently compatible Music Assistant media players.
  fields:
    entity_ids:
      name: Speakers
      description: Music Assistant media_player entities to use for House Chime announcements.
      required: true
      selector:
        entity:
          domain: media_player
          multiple: true

set_person_playback:
  name: Set person playback preference
  description: Enable or mute shared House Chime playback for one configured person while they are home.
  fields:
    person_id:
      name: Person ID
      description: The configured House Chime person ID.
      required: true
      selector:
        text:
    playback_enabled:
      name: Playback enabled
      description: When false, this person does not cause shared announcements to play while home.
      required: true
      selector:
        boolean:

set_playback_routes:
  name: Set playback source routes
  description: Replace saved source-routing rules that switch output zones to the selected announcement input before playback.
  fields:
    playback_routes:
      name: Playback routes
      description: >
        List of route objects. Each object needs target_player_entity_id, source,
        and zone_entity_ids. The target must be a compatible Music Assistant
        announcement player. Each zone must be an available media_player that can
        select the requested source.
      required: true
      example:
        - target_player_entity_id: media_player.whole_house
          source: Whole House
          zone_entity_ids:
            - media_player.great_room_zone
            - media_player.living_room_zone
      selector:
        object:
